spring.application.name=BaoLibrary
spring.datasource.url=jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=root
spring.datasource.password=181003

# Thay đổi từ validate sang update để cho phép Hibernate tự động cập nhật schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Cấu hình physical naming strategy để sử dụng tên chính xác từ entity/column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Tắt implicit naming strategy mặc định
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Cấu hình Flyway để cho phép tạo schema từ đầu
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=true

# JWT Configuration
jwt.secret=abcdefghijklmnOPQRSTUVWXYZ0123456789abcdefghijklmnOPQRSTUVWXYZ0123456789
jwt.expiration=86400000

# File upload configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Library configurations
library.borrowing.max-books=5
library.fees.late-fee-per-day=10000
library.fees.max-late-fee=200000

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

spring.main.allow-bean-definition-overriding=true

# Configure error handling for REST APIs
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# Debug to see what's happening with request mappings
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.resource=DEBUG

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}